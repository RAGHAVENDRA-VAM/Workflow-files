trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  resourceGroup: my-resource-group
  location: East US
  appServiceName: $(resourceGroup)-app-service
  appServicePlanName: $(resourceGroup)-app-service-plan
  clientId: $[client_id]
  clientSecret: $[client_secret]
  tenantId: $[tenant_id]
  subscriptionId: $[subscription_id]

stages:
- build
- deploy

build:
  stage: build
  displayName: Build
  jobs:
  - job: build
    displayName: Build
    steps:
    - task: TerraformInstaller@2
      displayName: Install Terraform
      inputs:
        terraformVersion: latest
    - task: TerraformTaskV2@2
      displayName: Initialize Terraform
      inputs:
        command: init
        workingDirectory: $(System.DefaultWorkingDirectory)
        environmentServiceName: Azure
    - task: TerraformTaskV2@2
      displayName: Validate Terraform
      inputs:
        command: validate
        workingDirectory: $(System.DefaultWorkingDirectory)
        environmentServiceName: Azure

deploy:
  stage: deploy
  displayName: Deploy
  dependsOn: build
  jobs:
  - deployment: deploy
    displayName: Deploy
    environment: production
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: Login to Azure
            inputs:
              azureSubscription: $(subscriptionId)
              script: |
                az account show
              addSpnToEnvironment: true
          - task: TerraformTaskV2@2
            displayName: Apply Terraform
            inputs:
              command: apply
              workingDirectory: $(System.DefaultWorkingDirectory)
              environmentServiceName: Azure
              commandOptions: -auto-approve
          - task: TerraformTaskV2@2
            displayName: Output Terraform
            inputs:
              command: output
              workingDirectory: $(System.DefaultWorkingDirectory)
              environmentServiceName: Azure

          - task: AzureAppServiceSettings@1
            displayName: Configure App Service settings
            inputs:
              azureSubscription: $(subscriptionId)
              appName: $(appServiceName)
              resourceGroupName: $(resourceGroup)

          - task: AzureAppServiceSettings@1
            displayName: Configure App Service Plan settings
            inputs:
              azureSubscription: $(subscriptionId)
              appName: $(appServicePlanName)
              resourceGroupName: $(resourceGroup)

          - task: AzureCLI@2
            displayName: Azure CLI
            inputs:
              azureSubscription: $(subscriptionId)
              script: |
                az group show --name $(resourceGroup)