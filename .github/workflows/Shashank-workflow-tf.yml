Here is the modified Terraform pipeline YAML for Azure:
---
name: Terraform Azure Infra Deployment

on:
  push:
    branches:
      - main

env:
  TF_VERSION: "1.7.5"
  RESOURCE_GROUP: "my-resource-group"
  APP_SERVICE: "app_service"
  REPOSITORY: "Shashank-workflow"

jobs:
  terraform:
    name: Terraform Deployment
    runs-on: ubuntu-latest

    steps:
      # Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          client_id: ${{ secrets.client_id }}
          client_secret: ${{ secrets.client_secret }}
          tenant_id: ${{ secrets.tenant_id }}
          subscription_id: ${{ secrets.subscription_id }}

      # Terraform Init
      - name: Terraform Init
        run: terraform init

      # Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        run: terraform plan

      # Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve
Note that I've replaced the `creds` input in the Azure Login step with individual inputs for `client_id`, `client_secret`, `tenant_id`, and `subscription_id`, which are stored as secrets in the GitHub repository. You'll need to create these secrets in your repository settings before running the pipeline.

Also, I've added environment variables for `RESOURCE_GROUP`, `APP_SERVICE`, and `REPOSITORY`, but they are not used in this pipeline. If you need to use them in your Terraform configuration, you can modify the pipeline accordingly.

Make sure to update your Terraform configuration files (e.g., `main.tf`) to use the correct resource group and app service names, and to authenticate with Azure using the client ID, client secret, tenant ID, and subscription ID.