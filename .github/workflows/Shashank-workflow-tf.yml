trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  resourceGroupName: 'my-resource-group'
  location: 'West US'
  appServicePlanName: 'my-app-service-plan'
  appServiceName: 'my-app-service'
  clientId: '$(client_id)'
  clientSecret: '$(client_secret)'
  tenantId: '$(tenant_id)'
  subscriptionId: '$(subscription_id)'

stages:
- build
- deploy

build:
  stage: build
  displayName: 'Build'
  jobs:
  - job: build
    displayName: 'Build'
    steps:
    - task: Terraform@2
      displayName: 'Initialize Terraform'
      inputs:
        command: 'init'
        workingDirectory: './'
        environmentServiceName: 'Azure'
    - task: Terraform@2
      displayName: 'Validate Terraform'
      inputs:
        command: 'validate'
        workingDirectory: './'
    - task: Terraform@2
      displayName: 'Plan Terraform'
      inputs:
        command: 'plan'
        workingDirectory: './'
        environmentServiceName: 'Azure'

deploy:
  stage: deploy
  displayName: 'Deploy'
  dependsOn: build
  jobs:
  - deployment: deploy
    displayName: 'Deploy'
    environment: 'production'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureLogin@2
            displayName: 'Login to Azure'
            inputs:
              clientId: '$(client_id)'
              clientSecret: '$(client_secret)'
              tenantId: '$(tenant_id)'
              subscriptionId: '$(subscription_id)'
          - task: Terraform@2
            displayName: 'Apply Terraform'
            inputs:
              command: 'apply'
              workingDirectory: './'
              environmentServiceName: 'Azure'
          - task: Terraform@2
            displayName: 'Output Terraform'
            inputs:
              command: 'output'
              workingDirectory: './'

          - task: AzureCLI@2
            displayName: 'Create Resource Group'
            inputs:
              azureSubscription: '$(subscriptionId)'
              script: |
                az group create --name $(resourceGroupName) --location $(location)
              workingDirectory: './'

          - task: AzureCLI@2
            displayName: 'Create App Service Plan'
            inputs:
              azureSubscription: '$(subscriptionId)'
              script: |
                az appservice plan create --name $(appServicePlanName) --resource-group $(resourceGroupName) --location $(location) --sku FREE
              workingDirectory: './'

          - task: AzureCLI@2
            displayName: 'Create App Service'
            inputs:
              azureSubscription: '$(subscriptionId)'
              script: |
                az webapp create --name $(appServiceName) --resource-group $(resourceGroupName) --location $(location) --plan $(appServicePlanName)
              workingDirectory: './'