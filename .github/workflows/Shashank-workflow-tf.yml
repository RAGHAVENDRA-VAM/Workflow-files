name: Terraform Azure Infra Deployment

on:
  push:
    branches:
      - main

env:
  TF_VERSION: "1.7.5"
  RESOURCE_GROUP: "my-resource-group"
  RESOURCE: "webapp"
  REPOSITORY: "Shashank-workflow"
  WORKING_DIRECTORY: "Shashank-workflow/webapp"

jobs:
  terraform:
    name: Terraform Deployment
    runs-on: ubuntu-latest

    steps:
      # Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Debug GitHub Context
      - name: Debug GitHub Context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch Ref: ${{ github.ref }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Workspace: ${{ github.workspace }}"

      # Debug Current Directory
      - name: Debug Current Directory
        run: |
          echo "Current Directory:"
          pwd

      # Debug Repository Structure
      - name: Debug Repository Structure
        run: |
          echo "===== ROOT FILES ====="
          ls -la

          echo "===== COMPLETE DIRECTORY TREE ====="
          find . -type d

          echo "===== COMPLETE FILE TREE ====="
          find .

      # Debug Working Directory
      - name: Debug Working Directory
        run: |
          echo "Expected Working Directory:"
          echo "${{ env.WORKING_DIRECTORY }}"

          if [ -d "${{ env.WORKING_DIRECTORY }}" ]; then
            echo "Directory EXISTS"
          else
            echo "Directory DOES NOT EXIST"
            exit 1
          fi

      # Debug Terraform Files
      - name: Debug Terraform Files
        run: |
          echo "Terraform Files:"
          ls -la "${{ env.WORKING_DIRECTORY }}"

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Verify Terraform Installation
      - name: Verify Terraform Version
        run: terraform version

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Terraform Init
      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.WORKING_DIRECTORY }}

      # Terraform Validate
      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.WORKING_DIRECTORY }}

      # Terraform Plan
      - name: Terraform Plan
        run: terraform plan
        working-directory: ${{ env.WORKING_DIRECTORY }}

      # Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ${{ env.WORKING_DIRECTORY }}
