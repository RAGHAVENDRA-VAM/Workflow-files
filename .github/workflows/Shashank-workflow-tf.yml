trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  resourceGroup: my-resource-group
  appName: $(resourceGroup)-app-service
  location: East US
  clientId: $(client_id)
  clientSecret: $(client_secret)
  tenantId: $(tenant_id)
  subscriptionId: $(subscription_id)

stages:
- build
- deploy

build:
  stage: build
  displayName: Build
  jobs:
  - job: build
    displayName: Build
    steps:
    - task: TerraformInstaller@2
      displayName: Install Terraform
      inputs:
        terraformVersion: latest
    - task: TerraformTaskV2@2
      displayName: Initialize Terraform
      inputs:
        command: init
        workingDirectory: $(System.DefaultWorkingDirectory)
        backendConfig: |
          resource_group_name = "$(resourceGroup)"
          storage_account_name = "$(appName)sa"
          container_name       = "$(appName)container"
          key                  = "$(appName).tfstate"
    - task: TerraformTaskV2@2
      displayName: Validate Terraform
      inputs:
        command: validate
        workingDirectory: $(System.DefaultWorkingDirectory)
    - task: TerraformTaskV2@2
      displayName: Plan Terraform
      inputs:
        command: plan
        workingDirectory: $(System.DefaultWorkingDirectory)
        environmentServiceName: $(clientId)
    - task: CopyFiles@2
      displayName: Copy Terraform files
      inputs:
        contents: |
          main.tf
          variables.tf
          outputs.tf
        targetFolder: $(Build.ArtifactStagingDirectory)

deploy:
  stage: deploy
  displayName: Deploy
  dependsOn: build
  jobs:
  - deployment: deploy
    displayName: Deploy
    environment: production
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - task: TerraformInstaller@2
            displayName: Install Terraform
            inputs:
              terraformVersion: latest
          - task: TerraformTaskV2@2
            displayName: Apply Terraform
            inputs:
              command: apply
              workingDirectory: $(System.DefaultWorkingDirectory)
              environmentServiceName: $(clientId)
          - task: TerraformTaskV2@2
            displayName: Output Terraform
            inputs:
              command: output
              workingDirectory: $(System.DefaultWorkingDirectory)

          - task: AzureAppServiceSettings@1
            displayName: Configure App Service settings
            inputs:
              azureSubscription: $(subscriptionId)
              appName: $(appName)
              resourceGroupName: $(resourceGroup)

          - task: AzureAppServiceManagement@0
            displayName: Configure App Service management
            inputs:
              azureSubscription: $(subscriptionId)
              appName: $(appName)
              resourceGroupName: $(resourceGroup)

          - task: AzureRmWebAppDeployment@4
            displayName: Deploy App Service
            inputs:
              azureSubscription: $(subscriptionId)
              appName: $(appName)
              resourceGroupName: $(resourceGroup)
              package: $(System.DefaultWorkingDirectory)/**/*.zip

          - task: AzureAppServiceSettings@1
            displayName: Configure App Service settings after deployment
            inputs:
              azureSubscription: $(subscriptionId)
              appName: $(appName)
              resourceGroupName: $(resourceGroup)