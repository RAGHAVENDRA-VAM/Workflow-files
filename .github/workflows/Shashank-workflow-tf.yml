---
name: Terraform Azure Infra Deployment

on:
  push:
    branches:
      - main

env:
  TF_VERSION: "1.7.5"
  RESOURCE_GROUP: "my-resource-group"
  REPOSITORY: "Shashank-workflow"

jobs:
  terraform:
    name: Terraform Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var="resource_group=${{ env.RESOURCE_GROUP }}" -var="repository=${{ env.REPOSITORY }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="resource_group=${{ env.RESOURCE_GROUP }}" -var="repository=${{ env.REPOSITORY }}"