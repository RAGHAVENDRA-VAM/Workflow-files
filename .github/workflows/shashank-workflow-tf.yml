---
name: Terraform Azure Infra Deployment

on:
  push:
    branches:
      - main

env:
  TF_VERSION: "1.7.5"
  RESOURCE_GROUP: "my-resource-group"
  RESOURCE: "webapp"
  REPOSITORY: "shashank-workflow"
  APPLICATION_STACK: "language: python@3.11"

jobs:
  terraform:
    name: Terraform Deployment
    runs-on: ubuntu-latest

    steps:
      # Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Terraform Init
      - name: Terraform Init
        working-directory: ./shashank-workflow/webapp
        run: terraform init

      # Terraform Validate
      - name: Terraform Validate
        working-directory: ./shashank-workflow/webapp
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        working-directory: ./shashank-workflow/webapp
        run: terraform plan

      # Terraform Apply
      - name: Terraform Apply
        working-directory: ./shashank-workflow/webapp
        run: terraform apply -auto-approve