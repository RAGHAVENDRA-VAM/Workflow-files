trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  resourceGroup: 'hari_check1'
  webapp: 'webapp'
  repository: 'Simple_Insurance_portal'
  environment: 'prod'
  terraformVersion: '1.2.5'

stages:
- build
- deploy

build:
  stage: build
  displayName: 'Build'
  jobs:
  - job: build
    displayName: 'Build'
    steps:
    - task: TerraformInstaller@0
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'
    - task: TerraformTaskV2@2
      displayName: 'Initialize'
      inputs:
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infrastructure'
        environmentServiceName: ''
    - task: TerraformTaskV2@2
      displayName: 'Validate'
      inputs:
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infrastructure'
        environmentServiceName: ''
    - task: TerraformTaskV2@2
      displayName: 'Plan'
      inputs:
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infrastructure'
        environmentServiceName: ''
        commandOptions: '-out=$(System.DefaultWorkingDirectory)/infrastructure/plan.tfplan'
    - task: PowerShell@2
      displayName: 'Save Plan'
      inputs:
        targetType: 'inline'
        script: 'Get-ChildItem -Path "$(System.DefaultWorkingDirectory)/infrastructure" -Filter "plan.tfplan" | Set-PipelineArtifact -Name "plan" -Path "$(System.DefaultWorkingDirectory)/infrastructure/plan.tfplan"'

deploy:
  stage: deploy
  displayName: 'Deploy'
  dependsOn: build
  jobs:
  - deployment: deploy
    displayName: 'Deploy'
    environment: '$(environment)'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: TerraformInstaller@0
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'
          - task: TerraformTaskV2@2
            displayName: 'Apply'
            inputs:
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/infrastructure'
              environmentServiceName: ''
              commandOptions: '-auto-approve -state=$(System.DefaultWorkingDirectory)/infrastructure/terraform.tfstate $(System.DefaultWorkingDirectory)/infrastructure/plan.tfplan'
          - task: AzureCLI@2
            displayName: 'Azure CLI'
            inputs:
              azureSubscription: 'your_azure_subscription'
              script: 'az group show -n $(resourceGroup)'
          - task: PowerShell@2
            displayName: 'Output Webapp URL'
            inputs:
              targetType: 'inline'
              script: 'Write-Host "https://$(webapp).azurewebsites.net"'