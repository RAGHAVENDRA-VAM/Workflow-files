trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  resourceGroup: hari_check1
  location: East US
  storageAccountName: $(resourceGroup)storage
  appServiceName: $(resourceGroup)appservice
  repositoryName: Simple_Insurance_portal

stages:
- build
- deploy

build:
  stage: build
  displayName: Build
  jobs:
  - job: build
    displayName: Build
    steps:
    - task: TerraformInstaller@2
      displayName: Install Terraform
      inputs:
        terraformVersion: latest
    - task: TerraformTaskV2@2
      displayName: Initialize Terraform
      inputs:
        command: init
        workingDirectory: $(System.DefaultWorkingDirectory)
    - task: TerraformTaskV2@2
      displayName: Validate Terraform
      inputs:
        command: validate
        workingDirectory: $(System.DefaultWorkingDirectory)
    - task: TerraformTaskV2@2
      displayName: Plan Terraform
      inputs:
        command: plan
        workingDirectory: $(System.DefaultWorkingDirectory)
        environmentServiceName: $(resourceGroup)
    - task: CopyFiles@2
      displayName: Copy Terraform files
      inputs:
        contents: |
          main.tf
          variables.tf
          outputs.tf
        targetFolder: $(build.artifactstagingdirectory)

    - task: PublishBuildArtifact@2
      displayName: Publish Artifact
      inputs:
        PathtoPublish: $(build.artifactstagingdirectory)
        ArtifactName: terraform
        publishLocation: Container

deploy:
  stage: deploy
  displayName: Deploy
  dependsOn: build
  jobs:
  - deployment: deploy
    displayName: Deploy
    environment: production
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - task: TerraformInstaller@2
            displayName: Install Terraform
            inputs:
              terraformVersion: latest
          - task: DownloadBuildArtifact@2
            displayName: Download Artifact
            inputs:
              buildType: current
              downloadPath: $(System.ArtifactsDirectory)
          - task: TerraformTaskV2@2
            displayName: Apply Terraform
            inputs:
              command: apply
              workingDirectory: $(System.ArtifactsDirectory)/terraform
              environmentServiceName: $(resourceGroup)
          - task: AzureCLI@2
            displayName: Azure CLI
            inputs:
              azureSubscription: $(azureSubscription)
              script: |
                az account show
              addSpnToEnvironment: true

          - task: AzureAppServiceSettings@1
            displayName: App Service Settings
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(appServiceName)

          - task: AzureAppServiceSettings@1
            displayName: Storage Account Settings
            inputs:
              azureSubscription: $(azureSubscription)
              accountName: $(storageAccountName)

          - task: AzureCLI@2
            displayName: Azure CLI
            inputs:
              azureSubscription: $(azureSubscription)
              script: |
                az resource list --resource-group $(resourceGroup)
              addSpnToEnvironment: true