trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  terraformVersion: '1.3.6'
  resourceGroup: 'hari_check1'
  storageAccountName: 'haristorageaccount'
  appServiceName: 'hariappservice'
  repositoryName: 'Simple_Insurance_portal'

stages:
- build
- deploy

build:
  stage: build
  displayName: 'Build'
  jobs:
  - job: build
    displayName: 'Build'
    steps:
    - task: TerraformInstaller@2
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'
    - task: TerraformTaskV2@2
      displayName: 'Initialize Terraform'
      inputs:
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        environmentServiceName: ''
    - task: TerraformTaskV2@2
      displayName: 'Validate Terraform'
      inputs:
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        environmentServiceName: ''
    - task: TerraformTaskV2@2
      displayName: 'Plan Terraform'
      inputs:
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        environmentServiceName: ''
        commandOptions: '-out=$(System.DefaultWorkingDirectory)/terraform.plan'
    - task: CopyFiles@2
      displayName: 'Copy Terraform Plan'
      inputs:
        contents: 'terraform.plan'
        targetFolder: '$(build.artifactstagingdirectory)'
    - task: PublishBuildArtifact@2
      displayName: 'Publish Artifact'
      inputs:
        artifactName: 'terraform'
        path: '$(build.artifactstagingdirectory)'

deploy:
  stage: deploy
  displayName: 'Deploy'
  dependsOn: build
  jobs:
  - deployment: deploy
    displayName: 'Deploy'
    environment: 'production'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: TerraformInstaller@2
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'
          - task: TerraformTaskV2@2
            displayName: 'Initialize Terraform'
            inputs:
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)'
              environmentServiceName: ''
          - task: DownloadBuildArtifact@2
            displayName: 'Download Artifact'
            inputs:
              artifactName: 'terraform'
              downloadPath: '$(System.DefaultWorkingDirectory)'
          - task: TerraformTaskV2@2
            displayName: 'Apply Terraform'
            inputs:
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)'
              environmentServiceName: ''
              commandOptions: '-auto-approve $(System.DefaultWorkingDirectory)/terraform.plan'
          - task: AzureCLI@2
            displayName: 'Create App Service'
            inputs:
              azureSubscription: 'your_subscription'
              script: |
                az appservice plan create --name $(appServiceName) --resource-group $(resourceGroup) --sku FREE
                az webapp create --name $(appServiceName) --resource-group $(resourceGroup) --plan $(appServiceName)
              workingDirectory: '$(System.DefaultWorkingDirectory)'
          - task: AzureCLI@2
            displayName: 'Create Storage Account'
            inputs:
              azureSubscription: 'your_subscription'
              script: |
                az storage account create --name $(storageAccountName) --resource-group $(resourceGroup) --sku Standard_LRS --kind StorageV2
              workingDirectory: '$(System.DefaultWorkingDirectory)'