trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  terraformVersion: '1.3.5'
  azureSubscription: 'your_azure_subscription'
  resourceGroup: 'hari_check1'
  location: 'East US'
  storageAccountName: 'haristorageaccount'
  appServiceName: 'hariappservice'

stages:
- build
- deploy

build:
  stage: build
  displayName: 'Build'
  jobs:
  - job: build
    displayName: 'Build'
    steps:
    - task: TerraformInstaller@2
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'
    - task: Terraform@2
      displayName: 'Initialize Terraform'
      inputs:
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Simple_Insurance_portal/terraform'
        environmentServiceName: '$(azureSubscription)'
    - task: Terraform@2
      displayName: 'Validate Terraform'
      inputs:
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Simple_Insurance_portal/terraform'
    - task: Terraform@2
      displayName: 'Plan Terraform'
      inputs:
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Simple_Insurance_portal/terraform'
        environmentServiceName: '$(azureSubscription)'
      outputs:
        plan: '$(System.DefaultWorkingDirectory)/Simple_Insurance_portal/terraform/plan'

deploy:
  stage: deploy
  displayName: 'Deploy'
  dependsOn: build
  jobs:
  - deployment: deploy
    displayName: 'Deploy'
    environment: 'production'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: Terraform@2
            displayName: 'Apply Terraform'
            inputs:
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/Simple_Insurance_portal/terraform'
              environmentServiceName: '$(azureSubscription)'
              commandOptions: '--auto-approve'
          - task: AzureCLI@2
            displayName: 'Create App Service'
            inputs:
              azureSubscription: '$(azureSubscription)'
              script: |
                az appservice plan create --name $(appServiceName) --resource-group $(resourceGroup) --location $(location) --sku S1
                az webapp create --name $(appServiceName) --resource-group $(resourceGroup) --location $(location) --plan $(appServiceName)
          - task: AzureCLI@2
            displayName: 'Create Storage Account'
            inputs:
              azureSubscription: '$(azureSubscription)'
              script: |
                az storage account create --name $(storageAccountName) --resource-group $(resourceGroup) --location $(location) --sku Standard_LRS
          - task: AzureCLI@2
            displayName: 'Output App Service URL'
            inputs:
              azureSubscription: '$(azureSubscription)'
              script: |
                echo "https://$(appServiceName).azurewebsites.net"