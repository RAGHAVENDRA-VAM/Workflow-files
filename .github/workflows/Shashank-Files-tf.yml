Here's a sample production-grade Terraform pipeline YAML file for Azure:

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  terraformVersion: '1.2.5'
  azureSubscription: 'Your Azure Subscription'
  resourceGroup: 'hari_check1'
  repositoryName: 'Shashank-Files'

stages:
- build
- deploy

build:
  stage: build
  displayName: 'Build'
  jobs:
  - job: build
    displayName: 'Build'
    steps:
    - task: TerraformInstaller@2
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'
    - task: Terraform@2
      displayName: 'Initialize Terraform'
      inputs:
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        environmentServiceName: '$(azureSubscription)'
    - task: Terraform@2
      displayName: 'Validate Terraform Configuration'
      inputs:
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
    - task: Terraform@2
      displayName: 'Plan Terraform Deployment'
      inputs:
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        environmentServiceName: '$(azureSubscription)'
      outputs:
        plan: '$(System.DefaultWorkingDirectory)/terraform.plan'

deploy:
  stage: deploy
  displayName: 'Deploy'
  dependsOn: build
  jobs:
  - deployment: deploy
    displayName: 'Deploy'
    environment: 'production'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: Terraform@2
            displayName: 'Apply Terraform Deployment'
            inputs:
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)'
              environmentServiceName: '$(azureSubscription)'
              commandOptions: '-auto-approve'
          - task: AzureCLI@2
            displayName: 'Create Resource Group'
            inputs:
              azureSubscription: '$(azureSubscription)'
              script: |
                az group create --name $(resourceGroup) --location "East US"
          - task: AzureCLI@2
            displayName: 'Create Repository'
            inputs:
              azureSubscription: '$(azureSubscription)'
              script: |
                az storage account create --name $(repositoryName) --resource-group $(resourceGroup) --location "East US" --sku Standard_LRS
                az storage share create --name $(repositoryName) --resource-group $(resourceGroup) --account-name $(repositoryName)

Please replace `'Your Azure Subscription'` with your actual Azure subscription name.

This YAML file includes the following stages and tasks:

1. **Build Stage**:
   - Installs Terraform.
   - Initializes the Terraform working directory.
   - Validates the Terraform configuration.
   - Plans the Terraform deployment.

2. **Deploy Stage**:
   - Applies the Terraform deployment plan.
   - Creates a resource group named `'hari_check1'`.
   - Creates a storage account and a file share named `'Shashank-Files'` in the resource group.

Note that the `Terraform@2` task is used for Terraform operations, and the `AzureCLI@2` task is used for Azure CLI operations.

Make sure to configure your Azure service connection in Azure DevOps and update the `azureSubscription` variable with the name of your Azure service connection. Also, ensure that the Azure service connection has the necessary permissions to create resources in your Azure subscription.