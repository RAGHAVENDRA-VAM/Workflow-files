Here's a production-grade Terraform pipeline YAML for Azure:
trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  terraformVersion: '1.2.5'
  resourceGroupName: 'hari_check1'
  location: 'East US'
  storageAccountName: 'haristorageaccount'
  appServiceName: 'hariappservice'
  sqlServerName: 'harisqlserver'
  sqlDatabaseName: 'harisqldatabase'

stages:
- build
- deploy

build:
  stage: build
  displayName: 'Build'
  jobs:
  - job: build
    displayName: 'Build'
    steps:
    - task: TerraformInstaller@0
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'
    - task: TerraformTaskV2@2
      displayName: 'Initialize Terraform'
      inputs:
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        environmentServiceName: 'Azure'
    - task: TerraformTaskV2@2
      displayName: 'Validate Terraform'
      inputs:
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
    - task: TerraformTaskV2@2
      displayName: 'Plan Terraform'
      inputs:
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        environmentServiceName: 'Azure'

deploy:
  stage: deploy
  displayName: 'Deploy'
  dependsOn: build
  jobs:
  - job: deploy
    displayName: 'Deploy'
    steps:
    - task: TerraformTaskV2@2
      displayName: 'Apply Terraform'
      inputs:
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        environmentServiceName: 'Azure'
    - task: AzureCLI@2
      displayName: 'Create Storage Account'
      inputs:
        azureSubscription: 'your_azure_subscription'
        script: |
          az storage account create --name $(storageAccountName) --resource-group $(resourceGroupName) --location $(location) --sku Standard_LRS
    - task: AzureCLI@2
      displayName: 'Create App Service'
      inputs:
        azureSubscription: 'your_azure_subscription'
        script: |
          az appservice plan create --name $(appServiceName) --resource-group $(resourceGroupName) --location $(location) --sku FREE
          az webapp create --name $(appServiceName) --resource-group $(resourceGroupName) --location $(location) --plan $(appServiceName)
    - task: AzureCLI@2
      displayName: 'Create SQL Server'
      inputs:
        azureSubscription: 'your_azure_subscription'
        script: |
          az sql server create --name $(sqlServerName) --resource-group $(resourceGroupName) --location $(location) --admin-user 'your_admin_username' --admin-password 'your_admin_password'
    - task: AzureCLI@2
      displayName: 'Create SQL Database'
      inputs:
        azureSubscription: 'your_azure_subscription'
        script: |
          az sql db create --name $(sqlDatabaseName) --resource-group $(resourceGroupName) --server $(sqlServerName) --edition Basic

resources:
  repositories:
  - repository: Shashank-Files
    type: git
    endpoint: 'your_azure_devops_endpoint'
    fetchTags: true
This pipeline has two stages: build and deploy. The build stage initializes, validates, and plans the Terraform configuration, while the deploy stage applies the Terraform configuration and creates the required resources in Azure.

Note that you'll need to replace the placeholders with your actual values:

* `your_azure_subscription`: your Azure subscription name
* `your_admin_username` and `your_admin_password`: the admin username and password for the SQL server
* `your_azure_devops_endpoint`: the endpoint for your Azure DevOps organization

Also, make sure to update the `terraformVersion` variable to the version of Terraform you're using.

In your Terraform configuration file (e.g., `main.tf`), you'll need to define the resources you want to create:
provider "azurerm" {
  version = "2.94.0"
  features {}
}

resource "azurerm_resource_group" "example" {
  name     = var.resourceGroupName
  location = var.location
}

resource "azurerm_storage_account" "example" {
  name                     = var.storageAccountName
  resource_group_name      = azurerm_resource_group.example.name
  location                 = azurerm_resource_group.example.location
  account_tier             = "Standard"
  account_replication