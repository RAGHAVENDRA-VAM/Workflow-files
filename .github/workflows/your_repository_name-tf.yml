---
name: Terraform Azure Infra Deployment

on:
  push:
    branches:
      - main

env:
  TF_VERSION: "1.7.5"
  RESOURCE_GROUP: "RESOURCE_GROUP"
  REPOSITORY_NAME: "your_repository_name"
  CLIENT_ID: ${{ secrets.client_id }}
  CLIENT_SECRET: ${{ secrets.client_secret }}
  TENANT_ID: ${{ secrets.tenant_id }}
  SUBSCRIPTION_ID: ${{ secrets.subscription_id }}

jobs:
  terraform:
    name: Terraform Deployment
    runs-on: ubuntu-latest

    steps:
      # Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.client_id }} ${{ secrets.client_secret }} ${{ secrets.tenant_id }} ${{ secrets.subscription_id }}

      # Terraform Init
      - name: Terraform Init
        run: terraform init

      # Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        run: terraform plan

      # Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve

      # Create App Service
      - name: Create App Service
        run: |
          terraform apply -auto-approve -target=azurerm_app_service.example
          echo "App Service created successfully"

      # Output
      - name: Output
        run: |
          echo "##[set-output name=output;]$(terraform output)"
          echo "Deployment completed successfully"