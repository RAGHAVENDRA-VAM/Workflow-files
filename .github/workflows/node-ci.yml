This YAML file defines a GitHub Actions workflow named "Node.js CI Pipeline" for a Node.js project. Here's an overview of its structure and key components:

**Triggers:**
- Runs on pull requests to the main branch.
- Runs on pushes to the main and develop branches.

**Environment Variables:**
- `ARTIFACT_NAME`: Dynamically set based on the repository name with a "-drop" suffix.
- `NODE_VERSION`: Uses Node.js version 20.x.
- `PROJECT_NAME`: Set to the repository name.

**Jobs:**
1. **build**
   - Checks out code.
   - Sets up Node.js with caching.
   - Installs dependencies (`npm ci`).
   - Builds the application (`npm run build`).
   - Uploads the build output from the `dist/` directory as an artifact.

2. **test**
   - Depends on `build`.
   - Checks out code.
   - Sets up Node.js.
   - Installs dependencies.
   - Runs unit tests with `npm test`, using the `jest-junit` reporter.
   - Publishes test results to a test reporter action.

3. **sast** (Security Scan)
   - Depends on `test`.
   - Checks out code.
   - Runs multiple security analysis tools:
     - **Gitleaks** for secret detection.
     - **Semgrep** for code analysis.
     - **Trivy** for dependency and filesystem scan.
   - Uploads all SARIF report files generated by the scans.

4. **publish**
   - Depends on `sast`.
   - Downloads the build artifact.
   - Uploads the build artifact again with a name based on `ARTIFACT_NAME`.

**Notes:**
- The workflow ensures that security scans are performed after testing.
- Artifacts are uploaded at various stages for use in other jobs or for archival.
- The use of `continue-on-error: true` allows security scans to fail without stopping the entire workflow, ensuring that reports are still uploaded.

